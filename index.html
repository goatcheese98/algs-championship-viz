<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ALGS Dashboard: replay a series game by game</title>
		<meta
			name="description"
			content="Standings from the Apex Legends Global Series, replayed game by game. Watch a series turn as a race, a rank chart, a score grid or a map of how each team earns its points."
		/>
		<meta property="og:title" content="ALGS Dashboard: replay a series game by game" />
		<meta
			property="og:description"
			content="Standings from the Apex Legends Global Series, replayed game by game: 36 series and 234 games from three events."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:image" content="/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="theme-color" content="#0d0f13" />
		<link rel="icon" href="/mark.svg" type="image/svg+xml" />
		<script>
			try {
				// The dashboard opens in the dark theme, which shows the map colours best.
				// A choice made with the theme button is kept and wins.
				const t = localStorage.getItem("theme");
				document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
			} catch {
				document.documentElement.dataset.theme = "dark";
			}
		</script>
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<div id="app"></div>
		<noscript>The ALGS Dashboard needs JavaScript to draw its charts.</noscript>
	</body>
</html>
